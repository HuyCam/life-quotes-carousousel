<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Life Quotes</title>
<meta name="description" content="34 life quotes, one at a time. Swipe, filter by theme, save favorites.">
<link rel="stylesheet" href="styles.css">
<script src="quotes.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="bg bg-a" data-theme="self" aria-hidden="true"></div>
<div class="bg bg-b" data-theme="self" aria-hidden="true"></div>

<div class="app" id="app">
  <div class="stage">
    <header class="topbar chrome">
      <span class="counter" id="counter">01 / 34</span>
      <span class="theme-label" id="themeLabel"></span>
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>
    </header>

    <button type="button" class="icon-btn arrow arrow-prev chrome" id="btnPrev" aria-label="Previous quote">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </button>
    <button type="button" class="icon-btn arrow arrow-next chrome" id="btnNext" aria-label="Next quote">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" stroke-width="2"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>
    </button>

    <main id="carousel" class="carousel" role="region" aria-roledescription="carousel" aria-label="Life quotes"></main>
    <p class="empty" id="empty" hidden>No favorites yet. Tap the heart on a quote to save it here.</p>
    <noscript><p class="empty">Life Quotes needs JavaScript to show the quotes.</p></noscript>
  </div>

  <nav class="bar chrome" aria-label="Quote controls">
    <div class="chips" id="chips" role="group" aria-label="Filter by theme"></div>
    <div class="actions">
      <button type="button" class="icon-btn" id="btnShuffle" aria-label="Shuffle" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 3.6c1.1 1.7 2.3 2.7 4.3 2.7H21"/><path d="M3 17h3.5c2 0 3.2-1 4.3-2.7"/><path d="M13.2 9.7C14.3 8 15.5 7 17.5 7H21"/><path d="M18.5 4.5L21 7l-2.5 2.5"/><path d="M18.5 14.5L21 17l-2.5 2.5"/></svg>
      </button>
      <button type="button" class="icon-btn heart" id="btnFav" aria-label="Favorite" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnShare" aria-label="Share quote">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8L15.8 7.2"/><path d="M8.2 13.2L15.8 16.8"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnFocus" aria-label="Focus mode" aria-pressed="false">
        <svg class="ic-enter" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V5h4"/><path d="M16 5h4v4"/><path d="M20 15v4h-4"/><path d="M8 19H4v-4"/></svg>
        <svg class="ic-exit" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4v5H4"/><path d="M15 4v5h5"/><path d="M20 15h-5v5"/><path d="M4 15h5v5"/></svg>
      </button>
    </div>
  </nav>

  <p class="hint chrome"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> navigate &middot; <kbd>S</kbd> shuffle &middot; <kbd>F</kbd> favorite &middot; <kbd>C</kbd> copy &middot; <kbd>Esc</kbd> exit</p>
</div>

<div class="toast" id="toast" aria-hidden="true"></div>
<div class="sr-only" id="live" role="status" aria-live="polite"></div>
</body>
</html>
